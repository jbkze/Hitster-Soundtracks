<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <title>Hitster Soundtracks Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Soundtrack Trainer</h1>
    <div class="progress"><span id="pos">0</span> / <span id="total">0</span></div>
  </header>

  <main>
    <section class="card" id="card">
      <div class="art-wrap">
        <img id="art" alt="" hidden>
        <div class="art-placeholder" id="artPlaceholder">♪</div>
      </div>

      <div class="player">
        <button class="play" id="playBtn" aria-label="Abspielen">
          <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="iconPause" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="status" id="status"></div>
      </div>

      <div class="answer" id="answer" hidden>
        <span class="badge" id="kind"></span>
        <h2 id="film"></h2>
        <p class="orig" id="orig"></p>
        <p class="year" id="year"></p>
        <p class="rec-year" id="recYear"></p>
        <dl>
          <dt>Komponist</dt><dd id="composer"></dd>
          <dt>Interpret</dt><dd id="artist"></dd>
          <dt>Titel</dt><dd id="track"></dd>
        </dl>
        <div class="links">
          <a id="ytLink" target="_blank" rel="noopener">YouTube</a>
          <a id="spLink" target="_blank" rel="noopener">Spotify</a>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="revealBtn">Aufdecken</button>
        <button class="btn" id="againBtn" hidden>Später nochmal</button>
        <button class="btn" id="nextBtn">Überspringen</button>
      </div>
    </section>

    <section class="settings">
      <div class="seg" role="group" aria-label="Filter">
        <button data-filter="all" class="on">Alle</button>
        <button data-filter="F">Filme</button>
        <button data-filter="S">Serien</button>
      </div>
      <label class="check"><input type="checkbox" id="autoplay" checked> Autoplay</label>
      <button class="btn small" id="shuffleBtn">Neu mischen</button>
    </section>

    <details class="list">
      <summary>Alle Karten anzeigen</summary>
      <input type="search" id="search" placeholder="Suchen …">
      <ol id="songList"></ol>
    </details>

    <p class="hint">Tasten: <kbd>Leertaste</kbd> Play/Pause · <kbd>Enter</kbd> Aufdecken/Weiter · <kbd>→</kbd> Überspringen</p>
  </main>

  <audio id="audio" preload="auto"></audio>
  <script src="songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
